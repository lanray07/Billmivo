name: Verify Billmivo

on:
  push:
    branches: [main]
    paths-ignore: ['deliverables/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdk="$RUNNER_TEMP/billmivo-android-sdk"
            archive="$RUNNER_TEMP/android-commandline.zip"
            curl --fail --silent --show-error --retry 3 --location \
              https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$archive"
            printf '%s  %s\n' 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583 "$archive" | sha256sum --check
            mkdir -p "$sdk/cmdline-tools"
            unzip -q "$archive" -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
            set +o pipefail
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses > /dev/null
            set -o pipefail
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Offline application and JVM tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Amazon SDK compile
        run: ./gradlew --no-daemon :app:assembleDebug -PbillmivoAmazon=true -PbillmivoAmazonSandbox=true
      - name: Localized resources
        shell: pwsh
        run: ./tools/check-locales.ps1
      - name: Receipt verifier
        run: node --test store/receipt-verifier/*.test.mjs
